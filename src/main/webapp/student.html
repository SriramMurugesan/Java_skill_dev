<!DOCTYPE html>

<html>

<head>

    <meta charset="UTF-8">

    <title>Add Student</title>

</head>

<body>

    <h1>Campus Student Management</h1>

    <h2>Add Student</h2>

    <form
        method="post"
        action="students">

        <label>
            Student Name:
        </label>

        <br>

        <input
            type="text"
            name="name"
            required>

        <br><br>


        <label>
            Department:
        </label>

        <br>

        <input
            type="text"
            name="department"
            required>

        <br><br>


        <button type="submit">
            Add Student
        </button>

    </form>

    <br>

    <a href="students">
        View Students
    </a>

</body>

</html>
