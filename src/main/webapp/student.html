<!DOCTYPE html>

<html>

<head>

    <title>Add Student</title>

</head>

<body>

<h1>Add Student</h1>

<form method="post" action="students">

    <label>
        Name:
    </label>

    <input
        type="text"
        name="name"
        required
    >

    <br><br>

    <label>
        Department:
    </label>

    <input
        type="text"
        name="department"
        required
    >

    <br><br>

    <button type="submit">
        Add Student
    </button>

</form>

<br>

<a href="students">
    View Students
</a>

</body>

</html>
